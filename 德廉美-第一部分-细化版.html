<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>德廉美：随心所欲 · 第一部分</title>
<style>
/* ===== 基础（平面灰白稿） ===== */
:root{--ink:#111;--chip:#dcdcdc;--chip-d:#cdcdcd;--panel:#c9c9c9;--line:#bdbdbd;--mut:#777}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;color:var(--ink);background:#fff}
button{font:inherit;border:0;cursor:pointer;transition:.15s;background:none}

/* ===== 屏幕 ===== */
.screen{display:none;position:relative;width:100%;height:100%;overflow:hidden}
.screen.active{display:flex;flex-direction:column}

/* ===== 顶栏（暂停 + 属性条） ===== */
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:clamp(16px,3vh,32px) clamp(20px,3.5vw,48px) 0;flex:0 0 auto}
.chip-btn{background:#43301d;border:2px solid #d9b36a;color:#f6ecd4;padding:clamp(10px,1.8vh,16px) clamp(20px,2.6vw,34px);font-size:clamp(16px,1.7vw,22px);box-shadow:inset 0 3px 0 #00000030,inset 0 -3px 0 #00000045;clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),4px calc(100% - 4px),4px 100%,0 100%)}
.chip-btn:hover{background:#57402a}
.chips{display:flex;gap:clamp(8px,1vw,14px);flex-wrap:wrap;justify-content:flex-end}
.stat-chip{background:#43301d;border:2px solid #d9b36a;min-width:clamp(58px,5.5vw,76px);padding:7px 10px;text-align:center;line-height:1.4;box-shadow:inset 0 3px 0 #00000030,inset 0 -3px 0 #00000045;clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),4px calc(100% - 4px),4px 100%,0 100%)}
.stat-chip small{display:block;font-size:clamp(12px,1.1vw,14px);color:#d9b36a}
.stat-chip b{display:block;font-size:clamp(14px,1.3vw,16px);font-weight:bold;color:#ffe9b0}
.stat-chip.hidden b{color:#9c8358}

/* ===== 顶栏下补充行 ===== */
.subbar{padding:clamp(8px,1.2vh,14px) clamp(20px,3.5vw,48px) 0;flex:0 0 auto}
.sc-eyebrow{font-size:clamp(12px,1.15vw,14px);color:var(--mut);letter-spacing:.06em}
.sc-title{font-size:clamp(20px,2.2vw,30px);margin-top:4px}

/* ===== 战争进度轴 ===== */
.war-rail{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:clamp(10px,1.6vh,16px) clamp(20px,3.5vw,48px) 0;flex:0 0 auto}
.rail-node{border:1px solid var(--line);background:#f4f4f4;padding:6px 9px;font-size:clamp(10px,1vw,12px);color:var(--mut);line-height:1.5}
.rail-node b{display:block;color:#333}
.rail-node.done{opacity:.45}
.rail-node.cur{border-color:#111;background:#e6e6e6}
.rail-node.cur b{color:#111}

/* ===== 剧情中段 ===== */
.stage-area{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;padding:clamp(14px,2.4vh,28px) clamp(20px,3.5vw,48px)}
.sc-text{max-width:900px}
.sc-text p{font-size:clamp(15px,1.5vw,18px);line-height:2;margin-bottom:10px}
.sc-text p:last-child{margin-bottom:0}

/* CG 位 */
.cg{margin:0 0 18px;border:1px solid var(--line);background:#f4f4f4;padding:12px;max-width:420px}
.cg-art{display:grid;place-items:center;height:clamp(70px,11vh,110px);color:#555}
.cg-art svg{height:100%;width:auto;max-width:100%}
.cg figcaption{text-align:center;font-size:12px;color:var(--mut);padding-top:6px}

/* ===== 底部选项区 ===== */
.option-zone{flex:0 0 auto;display:flex;justify-content:center;padding:clamp(10px,1.6vh,18px) clamp(20px,3.5vw,48px) clamp(20px,3.6vh,40px)}
.option-panel{width:min(920px,100%);background:var(--panel);padding:clamp(14px,2vh,22px);display:flex;flex-direction:column;gap:clamp(8px,1.4vh,12px);max-height:44vh;overflow-y:auto}
.choice{background:#d9d9d9;padding:clamp(10px,1.6vh,14px) 16px;text-align:center;font-size:clamp(15px,1.5vw,18px)}
.choice b{font-weight:normal}
.choice span{display:block;font-size:clamp(11px,1.05vw,13px);color:#555;margin-top:3px}
.choice:hover:not(:disabled){background:#cdcdcd}
.choice:disabled{opacity:.45;cursor:not-allowed}

/* ===== 对话框（逐句推进） ===== */
.dlg{width:min(920px,100%);background:var(--panel);padding:clamp(16px,2.4vh,26px) clamp(18px,2.4vw,30px);cursor:pointer;position:relative;min-height:clamp(96px,17vh,160px);display:flex;align-items:center}
.dlg .txt{font-size:clamp(15px,1.55vw,19px);line-height:1.9;max-height:36vh;overflow-y:auto;padding-right:14px}
.dlg b.spk{display:block;font-size:clamp(13px,1.2vw,15px);color:#444;margin-bottom:6px;letter-spacing:.06em}
.dlg .adv{position:absolute;right:16px;bottom:10px;font-style:normal;font-size:14px;color:#555;animation:bob .9s infinite alternate}
@keyframes bob{to{transform:translateY(4px)}}

/* ===== 战斗页（场景背景 + 像素件） ===== */
#battle{background:#131313}
#battle .stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100%,calc(100vh*16/9));height:min(100%,calc(100vw*9/16));background-size:100% 100%;background-repeat:no-repeat;display:flex;flex-direction:column}
#battle .topbar{position:relative;z-index:5}
#battle .war-rail{position:relative;z-index:5}
.battle-intro{flex:0 0 auto;padding:clamp(8px,1.4vh,16px) clamp(20px,3.5vw,48px) 0;position:relative;z-index:4}
.battle-intro p{max-width:900px;font-size:clamp(14px,1.4vw,17px);line-height:1.9;color:#f6ecd4;background:#140e08b3;border-left:3px solid #d9b36a;padding:10px 16px;text-shadow:1px 1px 0 #0007}
.battle-stage{flex:1;min-height:0;display:grid;grid-template-columns:1fr minmax(300px,500px) 1fr;gap:clamp(12px,2vw,28px);align-items:stretch;padding:clamp(10px,1.8vh,20px) clamp(20px,3.5vw,48px)}
.sprite{background:transparent;display:grid;place-items:center;color:#cbb27f;font-size:clamp(22px,2.6vw,36px);letter-spacing:.25em;writing-mode:vertical-rl;min-height:120px}
.sprite span{pointer-events:none;text-shadow:1px 1px 0 #0007}
.sprite.enemyph{background:#140e0859;border:2px dashed #d9b36a77}
.sprite img{max-width:90%;max-height:90%;image-rendering:pixelated}
.cg-art.pixel img{height:clamp(70px,11vh,110px);width:auto;max-width:100%;image-rendering:pixelated}
.dice-cols{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.4vw,18px);align-content:center}
.dice-col{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,12px)}
.dice-here{flex:1;min-height:clamp(90px,16vh,150px);border:1px dashed #d9b36a;background:#140e0880;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;align-content:center;padding:10px;color:#e8d9b0;font-size:12px;text-align:center;text-shadow:1px 1px 0 #0007}
.dice-here .lbl{width:100%}
.die{width:clamp(28px,2.6vw,38px);height:clamp(28px,2.6vw,38px);background:#fff;border:1px solid #111;display:grid;place-items:center;font-size:clamp(14px,1.4vw,18px);font-weight:bold}
.dice-sum{width:100%;text-align:center;font-weight:bold;font-size:clamp(14px,1.4vw,17px)}
.dice-count{background:#43301d;border:2px solid #d9b36a;color:#f6ecd4;padding:clamp(8px,1.4vh,12px) 10px;text-align:center;font-size:clamp(12px,1.15vw,14px);line-height:1.5;box-shadow:inset 0 3px 0 #00000030,inset 0 -3px 0 #00000045;clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),4px calc(100% - 4px),4px 100%,0 100%)}
.dice-count small{display:block;color:#d9b36a;font-size:clamp(11px,1vw,12px)}
.battle-foot{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.4vh,14px);padding:0 clamp(20px,3.5vw,48px) clamp(20px,3.6vh,40px)}
.result{font-size:clamp(18px,2vw,26px);font-weight:bold;min-height:1.2em;text-align:center;color:#ffe9b0;text-shadow:2px 2px 0 #0007}

/* ===== 章节页 ===== */
#chapter{background:#000;color:#fff;align-items:center;justify-content:center;text-align:center;cursor:pointer}
#chapter .cn{font-size:clamp(38px,5vw,60px);font-weight:normal}
#chapter .nm{font-size:clamp(24px,3vw,34px);margin-top:clamp(14px,2.4vh,24px)}
#chapter .fr{font-size:clamp(16px,1.8vw,22px);margin-top:clamp(8px,1.4vh,14px);color:#bbb}

/* ===== 结局页 ===== */
#ending{background:#4a4a4a;color:#f0f0f0;align-items:center;text-align:center;padding-top:clamp(36px,7vh,80px)}
#ending h1{font-size:clamp(26px,3.2vw,40px);font-weight:normal;letter-spacing:.08em}
.end-box{width:min(780px,92%);background:#6b6b6b;padding:clamp(28px,5vh,52px) clamp(20px,3vw,44px);margin-top:clamp(22px,4vh,44px);max-height:52vh;overflow-y:auto}
.end-box p{font-size:clamp(14px,1.4vw,17px);line-height:2;white-space:pre-line}
.end-stats{display:flex;justify-content:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.end-stats .stat-chip{background:#5c5c5c;color:#eee}
.end-stats .stat-chip.hidden b{color:#999}
#endGo{margin-top:clamp(22px,4vh,40px);background:#43301d;border:2px solid #d9b36a;color:#f6ecd4;padding:clamp(12px,2vh,16px) clamp(34px,4vw,52px);font-size:clamp(16px,1.6vw,20px);box-shadow:inset 0 3px 0 #00000030,inset 0 -3px 0 #00000045;clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),4px calc(100% - 4px),4px 100%,0 100%)}
#endGo:hover{background:#57402a}

/* ===== 标题页 ===== */
#intro{align-items:center;justify-content:center;background:#fff}
.title-inner{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;max-width:820px;padding:0 24px;z-index:2}
.title-inner h1{font-size:clamp(40px,6vw,84px);font-weight:700;letter-spacing:.04em;line-height:1.15}
.title-sub{font-size:clamp(13px,1.3vw,18px);color:var(--mut);margin-top:clamp(8px,1.6vh,16px)}
.title-menu{display:flex;flex-direction:column;gap:12px;width:min(380px,100%);margin-top:clamp(24px,5vh,52px)}
.title-button{background:#43301d;border:2px solid #d9b36a;color:#f6ecd4;padding:14px;font-size:clamp(16px,1.7vw,20px);letter-spacing:.2em;box-shadow:inset 0 3px 0 #00000030,inset 0 -3px 0 #00000045;clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),4px calc(100% - 4px),4px 100%,0 100%)}
.title-button:hover{background:#57402a}
#intro .credits{position:absolute;left:clamp(20px,4vw,60px);bottom:clamp(16px,3vh,36px);font-size:12px;line-height:1.9;color:#999;text-align:left}

/* 篇章（标题页） */
.chapters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(820px,100%);margin-top:clamp(26px,5vh,52px)}
.chapter-card{border:1px solid var(--line);background:#f7f7f7;padding:12px 14px;text-align:left;line-height:1.55;color:var(--mut);font-size:12px;transition:.15s}
.chapter-card b{display:block;font-size:14px;color:#222;margin-bottom:3px}
.chapter-card small{display:block;color:#999}
.chapter-card.tbd{border-style:dashed;cursor:pointer}
.chapter-card.tbd:hover{background:#eee}
.chapter-card .ph{display:inline-block;margin-top:6px;font-size:11px;color:#999;border:1px dashed #bbb;padding:1px 7px}

/* ===== 弹窗 ===== */
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.modal.open{display:flex}
.modal-card{width:min(640px,100%);background:#fff;border:1px solid #111;padding:clamp(20px,3vh,32px);max-height:86vh;overflow-y:auto}
.modal-card h2{margin:6px 0 12px;font-size:clamp(18px,2vw,24px)}
.modal-card p{font-size:14px;line-height:1.9;color:#444;margin-bottom:16px;white-space:pre-line}
.modal-card .actions{display:grid;grid-template-columns:1fr;gap:10px}
.pz-sec{margin-bottom:14px}
.pz-sec h4{font-size:13px;color:var(--mut);margin-bottom:8px;font-weight:normal;letter-spacing:.1em}
.pz-log{background:#f4f4f4;padding:10px 12px;font:12px/1.9 ui-monospace,monospace;color:#444;max-height:160px;overflow-y:auto}
.party{display:flex;flex-wrap:wrap;gap:6px}
.party span{background:var(--chip);padding:3px 12px;font-size:12px}
.party span.gone{opacity:.4;text-decoration:line-through}
.favor{display:flex;flex-direction:column;gap:7px}
.favor-row{display:flex;align-items:center;gap:8px;font-size:12px;color:#444}
.favor-row>span{flex:0 0 58px}
.favor-bar{flex:1 1 auto;height:6px;background:#e5e5e5;overflow:hidden}
.favor-bar i{display:block;height:100%;background:#111}
.favor-row>b{flex:0 0 26px;text-align:right;font-variant-numeric:tabular-nums}
.favor-row.gone{opacity:.45;text-decoration:line-through}

/* ===== 黑幕（【黑屏】舞台指示） ===== */
#scene #blackout{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s;z-index:8}
#scene #blackout.on{opacity:1}

/* ===== 场景行走小人 ===== */
#scene .walker{position:absolute;bottom:47%;left:-14%;height:46%;aspect-ratio:290/720;background-size:200% 100%;background-repeat:no-repeat;image-rendering:pixelated;z-index:3;transition:left 2.6s linear;filter:drop-shadow(3px 3px 0 #00000030);transform:scaleX(-1)}
#scene .walker.walk{animation:walkstep .5s linear infinite}
@keyframes walkstep{0%{background-position:0 0}49.9%{background-position:0 0}50%{background-position:100% 0}100%{background-position:100% 0}}
#scene .walker.flip{transform:scaleX(1)}
#scene .hud-hint{position:absolute;top:13%;left:3.2%;z-index:5;color:#ffe9b0b0;font-size:clamp(11px,1vw,13px);text-shadow:1px 1px 0 #0008;pointer-events:none;letter-spacing:.05em}

/* ===== 场景页（画框场景 + 板上对话框） ===== */
#scene{background:#131313}
#scene .stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100%,calc(100vh*16/9));height:min(100%,calc(100vw*9/16));background-size:100% 100%;background-repeat:no-repeat}
#scene .hud{position:absolute;top:2.2%;left:2.4%;right:2.4%;display:flex;justify-content:space-between;align-items:flex-start;z-index:6}
#scene .chip-btn,#scene .stat-chip{opacity:.93}
#scene .war-rail{position:absolute;top:2.4%;left:50%;transform:translateX(-50%);width:50%;margin:0;z-index:5}
#scene .war-rail .rail-node{background:#f7f2e4f0;border-color:#a8874f}
#scene .hud-cg{position:absolute;left:3.2%;top:31%;z-index:4;pointer-events:none}
#scene .cg{border:0;background:none;padding:0;max-width:230px;margin:0}
#scene .cg figcaption{color:#fff3d8;text-shadow:1px 1px 0 #0008}
#scene .board{position:absolute;left:9.4%;top:53.3%;width:80%;height:44.4%;z-index:4}
#scene .dlg{position:absolute;inset:7% 5.5% 8% 5.5%;width:auto;background:transparent;min-height:0;cursor:pointer;display:flex;align-items:center}
#scene .dlg .txt{color:#f6ecd4;font-size:clamp(15px,1.5vw,19px);line-height:1.85;max-height:100%;padding-right:12px}
#scene .dlg b.spk{display:block;color:#ffd98a;font-size:clamp(13px,1.25vw,16px);margin-bottom:6px;letter-spacing:.06em}
#scene .dlg .adv{position:absolute;right:14px;bottom:8px;color:#ffe9b0;font-style:normal;font-size:14px;animation:bob .9s infinite alternate}
#scene .bpanel{position:absolute;inset:6% 6.5% 9% 6.5%;display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,1.6vh,14px);overflow-y:auto}
#scene .choice{background:#f6ecd4;color:#43301d;border:2px solid #6b4b2f;box-shadow:2px 2px 0 #00000045;text-align:center}
#scene .choice b{color:#43301d;font-weight:bold}
#scene .choice span{color:#7a5c3a}
#scene .choice:hover:not(:disabled){background:#fff6de}

@media(max-width:800px){
  .topbar{padding:14px 16px 0}
  .battle-stage{grid-template-columns:1fr;gap:10px;padding:10px 16px}
  .sprite{min-height:70px;writing-mode:horizontal-tb;font-size:18px}
  .war-rail{margin:10px 16px 0}
  .stage-area{padding:12px 16px}
  .chapters{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<!-- 开始页 -->
<section id="intro" class="screen active">
  <div class="title-inner">
    <h1>随心所欲<br>各行其是</h1>
    <p class="title-sub">德廉美修道院 · 第一部 · 无钟之地　——　FAY CE QUE VOULDRAS</p>
    <div class="title-menu">
      <button id="startBtn" type="button" class="title-button">开始游戏</button>
      <button id="exitBtn" type="button" class="title-button">退出游戏</button>
    </div>
  </div>
  <div class="credits">
    <div>策划&amp;编剧：仇心怡；余陆陆；冯钰</div>
    <div>程序：曹培文</div>
    <div>美术：许宁倩</div>
  </div>
</section>

<!-- 章节页 -->
<section id="chapter" class="screen">
  <div class="cn" id="chNum"></div>
  <div class="nm" id="chName"></div>
  <div class="fr" id="chForeign"></div>
</section>

<!-- 剧情页（画框场景 + 对话框板） -->
<section id="scene" class="screen">
  <div class="stage" id="sceneStage">
    <div class="hud">
      <button id="pauseBtn" type="button" class="chip-btn">暂停</button>
      <div id="sceneStats" class="chips"></div>
    </div>
    <div id="warRail" class="war-rail" hidden></div>
    <div class="hud-hint">空格 / 点击 继续对话　·　A / D 移动　·　对话读完走到最右侧切换场景</div>
    <div id="scCg" class="hud-cg" hidden></div>
    <div id="walker" class="walker"></div>
    <div class="board">
      <div id="dlgBox" class="dlg" hidden></div>
      <div id="scChoices" class="bpanel"></div>
    </div>
    <div id="blackout"></div>
  </div>
</section>

<!-- 战斗页 -->
<section id="battle" class="screen">
  <div class="stage" id="battleStage">
    <div class="topbar">
      <button id="pauseBtn2" type="button" class="chip-btn">暂停</button>
      <div id="battleStats" class="chips"></div>
    </div>
    <div id="warRail2" class="war-rail" hidden></div>
    <div class="battle-intro"><p id="battleText"></p></div>
    <div class="battle-stage">
      <div class="sprite" id="plSprite"><span>我方立绘</span></div>
      <div class="dice-cols">
        <div class="dice-col">
          <div id="pDice" class="dice-here"><span class="lbl">这里放骰子+点数</span></div>
          <div id="pCount" class="dice-count"><small>我方</small>骰子数 0 枚</div>
        </div>
        <div class="dice-col">
          <div id="eDice" class="dice-here"><span class="lbl">这里放骰子+点数</span></div>
          <div id="eCount" class="dice-count"><small>敌方</small>骰子数 0 枚</div>
        </div>
      </div>
      <div class="sprite enemyph"><span>敌方立绘</span></div>
    </div>
    <div class="battle-foot">
      <div id="battleResult" class="result"></div>
      <div id="battleActions"></div>
    </div>
  </div>
</section>

<!-- 结局页 -->
<section id="ending" class="screen">
  <h1 id="endingTitle"></h1>
  <div class="end-box">
    <p id="endingText"></p>
    <div id="endingStats" class="end-stats"></div>
  </div>
  <button id="endGo" type="button">继续</button>
</section>

<div id="eventModal" class="modal">
  <div class="modal-card">
    <div class="sc-eyebrow" id="modalEyebrow">读条</div>
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <div id="modalActions" class="actions"></div>
  </div>
</div>

<div id="pauseModal" class="modal">
  <div class="modal-card">
    <h2>暂停</h2>
    <div class="pz-sec"><h4>同行者</h4><div id="pzParty" class="party"></div></div>
    <div class="pz-sec"><h4>关系</h4><div id="pzFavor" class="favor"></div></div>
    <div class="pz-sec"><h4>行动记录</h4><div id="pzLog" class="pz-log"></div></div>
    <div class="actions">
      <button id="pzResume" type="button" class="choice"><b>继续游戏</b></button>
      <button id="pzRestart" type="button" class="choice"><b>重新开始</b></button>
      <button id="pzExit" type="button" class="choice"><b>退出到标题</b></button>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   德廉美 · 第一部分
   数值规则：
     初始   智慧100 / 力量100 / 声望100 / 酒量500（隐藏）
     骰子数 clamp(1 + floor(属性/100), 2, 8)
     酒量 >= 1000 → 结局一
   ========================================================================== */
const CFG = {
  init: { wisdom:100, strength:100, fame:100, drink:500 },
  drinkEnding: 1000,
  dice(v){ return Math.min(8, Math.max(2, 1 + Math.floor(v/100))); }
};
/* 数值校准提示：
   按《第一部分数值说明》，午餐与晚餐也会给酒量 +50。因此
     · 五次「喝酒」全选：500 + 5×100 + 2×50 = 1100  → 触发结局一
     · 只喝白天四个时段、夜晚去藏书：500 + 4×100 + 2×50 = 1000 → 同样触发
   若想严格做到「七次选择每一次都喝酒才触发」，把 init.drink 改成 400
   （则全喝酒恰好 1000，少喝一次为 900 不触发），或把 drinkEnding 改成 1100。 */
const STAT_ORDER = ['wisdom','strength','fame','drink'];
const STAT_NAME  = { wisdom:'智慧', strength:'力量', fame:'声望', drink:'酒量' };

let S = {}, F = {}, LOG = [];

function reset(){
  S = Object.assign({}, CFG.init);
  F = {
    drinkRevealed:false, peace:false, leaderWay:null, duel:null,
    margaSorty:0, agnes:false, pierre:false,
    mFavor:50, pFavor:50,
    margaretLeft:false, linaStays:true, stage:0
  };
  LOG = [];
}
function add(eff){ if(!eff) return; for(const k in eff) S[k] = Math.max(0, S[k] + eff[k]); }
function say(t){ LOG.unshift(t); }
function ef(eff){
  return Object.keys(eff||{}).map(k=>{
    const v = eff[k];
    return STAT_NAME[k] + (v>0?' +':v<0?' ':' ') + v;
  }).join('　');
}

/* ---------- 插画（事件 CG 位） ---------- */
const EMB = {
  grape:'<circle cx="46" cy="36" r="7"/><circle cx="60" cy="36" r="7"/><circle cx="74" cy="36" r="7"/><circle cx="53" cy="48" r="7"/><circle cx="67" cy="48" r="7"/><circle cx="60" cy="60" r="7"/><path d="M60 20v10"/><path d="M60 20c8 0 15 5 16 13"/>',
  gate:'<path d="M24 78V48a36 36 0 0172 0v30"/><path d="M40 78V58a20 20 0 0140 0v20"/><path d="M30 26l16 7-7 9"/><path d="M44 14h32" stroke-width="7" opacity=".35"/>',
  barrel:'<ellipse cx="60" cy="22" rx="22" ry="7"/><path d="M38 22v46a22 9 0 0044 0V22"/><path d="M38 36a22 8 0 0044 0"/><path d="M38 52a22 8 0 0044 0"/>',
  bell:'<path d="M60 14v10"/><path d="M38 62c0-25 9-38 22-38s22 13 22 38z"/><path d="M31 62h58"/><path d="M52 74h16"/>',
  book:'<path d="M60 24v52"/><path d="M60 28C48 20 30 22 22 28v42c8-6 26-8 38 0"/><path d="M60 28c12-8 30-6 38 0v42c-8-6-26-8-38 0"/>',
  sword:'<path d="M60 12v50"/><path d="M46 38h28"/><path d="M60 64v16"/><path d="M52 80h16"/>',
  cannon:'<path d="M18 58h54l12-12"/><circle cx="32" cy="66" r="9"/><circle cx="58" cy="66" r="9"/><path d="M26 48h46"/>',
  sausage:'<rect x="28" y="24" width="64" height="22" rx="11"/><rect x="34" y="50" width="52" height="16" rx="8"/><path d="M40 66v14M80 66v14"/>',
  figure:'<circle cx="60" cy="22" r="9"/><path d="M60 31v32"/><path d="M44 42h32"/><path d="M60 63l-12 18M60 63l12 18"/>',
  cup:'<path d="M40 20h40l-7 27a13 13 0 01-26 0z"/><path d="M60 58v12"/><path d="M48 72h24"/>',
  target:'<circle cx="60" cy="45" r="26"/><circle cx="60" cy="45" r="16"/><circle cx="60" cy="45" r="6"/><path d="M60 45l42-24"/>',
  scroll:'<path d="M34 20h52v56H34z"/><path d="M44 32h32M44 44h32M44 56h20"/>'
};
function cgHTML(key, cap){
  return '<figure class="cg"><div class="cg-art"><svg viewBox="0 0 120 92" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(EMB[key]||'')+'</svg></div><figcaption>'+cap+'</figcaption></figure>';
}

/* ---------- 渲染 ---------- */
const $ = id => document.getElementById(id);
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $(id).classList.add('active'); }

function chipsHTML(){
  return STAT_ORDER.map(k=>{
    const hidden = (k==='drink' && !F.drinkRevealed);
    return '<div class="stat-chip'+(hidden?' hidden':'')+'"><small>'+STAT_NAME[k]+'</small><b>'+(hidden?'？':S[k])+'</b></div>';
  }).join('');
}
function logHTML(n){
  return LOG.slice(0, n||7).map(x=>'› '+x).join('<br>') || '› 你的故事还没有开始。';
}
function partyList(){
  const p = ['你','菲利普'];
  if(!F.margaretLeft){ p.push('玛格丽特','莉娜'); }
  else if(F.linaStays){ p.push('莉娜'); }
  return p;
}
function partyHTML(){
  const cur = partyList();
  const all = ['你','菲利普','玛格丽特','莉娜'];
  return all.map(n=>'<span'+(cur.indexOf(n)<0?' class="gone"':'')+'>'+n+'</span>').join('');
}

/* ---------- 关系值（玛格丽特 / 菲利普） ----------
   分支触发仍严格按细纲：用 margaSorty（出战次数）与 duel 来判定，
   mFavor / pFavor 只是把「同伴对你的态度」显式数值化，供玩家读数，不改变分支。 */
function favor(dm, dp){
  F.mFavor = Math.max(0, Math.min(100, F.mFavor + dm));
  F.pFavor = Math.max(0, Math.min(100, F.pFavor + dp));
}
function favorLabel(v){
  return v>=80?'推心置腹':v>=60?'亲近':v>=40?'平常':v>=20?'冷淡':'疏远';
}
function favorHTML(){
  return [
    { n:'玛格丽特', v:F.mFavor, gone:F.margaretLeft },
    { n:'菲利普',   v:F.pFavor, gone:false }
  ].map(x=>'<div class="favor-row'+(x.gone?' gone':'')+'"><span>'+x.n+'</span>'
    +'<div class="favor-bar"><i style="width:'+x.v+'%"></i></div>'
    +'<b title="'+favorLabel(x.v)+'">'+x.v+'</b></div>').join('');
}
function paintSide(){
  $('sceneStats').innerHTML = chipsHTML();
  $('battleStats').innerHTML = chipsHTML();
  if($('pauseModal').classList.contains('open')){
    $('pzParty').innerHTML = partyHTML();
    $('pzFavor').innerHTML = favorHTML();
    $('pzLog').innerHTML = logHTML(40);
  }
}

const STAGES = ['迎战香肠人','巧施酒桶计','抵抗大轰炸','夜袭修道院','决战 · 大钟'];
function railHTML(active){
  return STAGES.map((n,i)=>{
    const idx = i+1;
    const cls = idx < active ? 'done' : idx === active ? 'cur' : '';
    return '<div class="rail-node '+cls+'"><b>'+idx+'. '+n+'</b>'+(idx<active?'已结束':idx===active?'进行中':'待启')+'</div>';
  }).join('');
}
function paintRail(active){
  ['warRail','warRail2'].forEach(id=>{ const el=$(id); el.hidden=false; el.innerHTML=railHTML(active); });
}
function hideRail(){ ['warRail','warRail2'].forEach(id=>{ const el=$(id); el.hidden=true; el.innerHTML=''; }); }

/* ---------- 对话框：逐句推进 ---------- */
const SPEAKERS = ['严肃的圣弗洛朗老修士','愤怒的圣弗洛朗修士','涨红了脸的圣弗洛朗修士','匆匆跑来的修士甲','圣弗洛朗的修士','圣弗洛朗修士们','德廉美修士甲','德廉美修士乙','稍远一点的修士们','年幼的小修士','香肠人翻译','香肠人首领','玛格丽特','菲利普','菲力普普','皮埃尔','艾格尼丝','托马斯','莉娜','阿尔蒙','老修士','喂马人','新修士甲','新修士乙','新修士丙','修士甲','修士乙','修士丙','众修士','哑女','士兵','我','你'];
let DLG = null;
function dlgSpeaker(t){
  for(const sp of SPEAKERS){
    if(t.startsWith(sp + '：')) return [sp, t.slice(sp.length + 1)];
  }
  return null;
}
function scene(o){
  show('scene');
  $('scCg').innerHTML        = o.cg ? cgHTML(o.cg, o.cgCap || '') : '';
  $('scCg').hidden           = !o.cg;
  if(o.rail) paintRail(o.rail); else hideRail();
  paintSide();
  $('blackout').classList.remove('on');
  DLG = { lines:(o.text||[]).slice(), i:0 };
  paintDlg();
  wkReset();   /* 切换场景：小人回到左侧，由玩家 A/D 走到右侧 */
  $('scChoices').innerHTML = '';
  (o.choices||[]).forEach(c=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'choice' + ((o.choices.length===1)?' single':'');
    b.innerHTML = '<b>'+c.label+'</b><span>'+(c.desc||'')+'</span>';
    if(c.disabled){ b.disabled = true; }
    b.addEventListener('click', ()=>{
      add(c.eff);
      if(c.note) say(c.note);
      paintSide();
      c.go && c.go();
    });
    $('scChoices').appendChild(b);
  });
}
function dlgBlackoutNow(){
  const t = DLG.lines[DLG.i];
  const rest = t.slice(4).trim();   /* 去掉「【黑屏】」 */
  if(rest){ DLG.lines[DLG.i] = rest; } else { DLG.i++; }
  paintDlg();
}
function paintDlg(){
  const box = $('dlgBox'), done = !DLG || DLG.i >= DLG.lines.length;
  if(!done && DLG.lines[DLG.i].indexOf('【黑屏】') === 0){
    box.hidden = true;
    $('scChoices').style.display = 'none';
    $('blackout').classList.add('on');
    setTimeout(()=>{ $('blackout').classList.remove('on'); dlgBlackoutNow(); }, 1200);
    return;
  }
  box.hidden = done;
  $('scChoices').style.display = done ? '' : 'none';
  if(done){ wkArmed = true; return; }   /* 对话读完：允许走到最右侧切换场景 */
  const t = DLG.lines[DLG.i];
  const sp = dlgSpeaker(t);
  box.innerHTML = '<div class="txt">'+(sp ? '<b class="spk">'+sp[0]+'</b>'+sp[1] : t)+'</div><i class="adv">▼</i>';
  const txt = box.querySelector('.txt'); if(txt) txt.scrollTop = 0;
}
function dlgNext(){
  if(!DLG || $('dlgBox').hidden) return;
  DLG.i++;
  paintDlg();
}

/* ---------- 切换场景：小人回到左侧待命，行走交给玩家 A/D ---------- */
function wkReset(){
  const wk = $('walker');
  wk.style.backgroundImage = 'url(' + IMG.walker + ')';
  wk.classList.remove('flip', 'walk');
  wk.style.transition = 'none';
  wk.style.left = '12%';
  wkArmed = true;
}

/* ---------- A / D 左右移动；对话读完后走到最右侧 → 切换下一场景 ---------- */
const WK_KEYS = { l:false, r:false };
let wkArmed = true;
function wkPos(){ return parseFloat($('walker').style.left) || 0; }
function wkSet(v){ const wk = $('walker'); wk.style.transition = 'none'; wk.style.left = v + '%'; }
document.addEventListener('keydown', e=>{
  const k = (e.key || '').toLowerCase();
  if(k === 'a' || e.key === 'ArrowLeft'){ WK_KEYS.l = true; e.preventDefault(); }
  if(k === 'd' || e.key === 'ArrowRight'){ WK_KEYS.r = true; e.preventDefault(); }
});
document.addEventListener('keyup', e=>{
  const k = (e.key || '').toLowerCase();
  if(k === 'a' || e.key === 'ArrowLeft'){ WK_KEYS.l = false; }
  if(k === 'd' || e.key === 'ArrowRight'){ WK_KEYS.r = false; }
});
function walkAdvance(){
  /* 仅在对话全部读完（选项面板已出现）时生效：单一选项 = 走入下一场景 */
  const btns = Array.prototype.slice.call(document.querySelectorAll('#scChoices .choice')).filter(b=>!b.disabled);
  if(btns.length === 1){ btns[0].click(); }
}
(function wkLoop(){
  setTimeout(wkLoop, 33);
  const wk = $('walker'); if(!wk) return;
  if(!$('scene').classList.contains('active')) return;
  if($('pauseModal').classList.contains('open') || $('eventModal').classList.contains('open')) return;
  let v = wkPos(), moving = false;
  if(WK_KEYS.l){ v -= 1.4; moving = true; }
  if(WK_KEYS.r){ v += 1.4; moving = true; }
  if(moving){
    v = Math.max(-2, Math.min(88, v));
    wkSet(v);
    wk.classList.add('walk');
    wk.classList.toggle('flip', WK_KEYS.l && !WK_KEYS.r);
    if(v >= 85 && wkArmed && $('dlgBox').hidden){ wkArmed = false; walkAdvance(); }
    else if(v < 80){ wkArmed = true; }
  } else {
    wk.classList.remove('walk');
  }
})();

/* ---------- 通用弹窗 ---------- */
function modal(title, text, eyebrow, actions){
  $('modalEyebrow').textContent = eyebrow || '读条';
  $('modalTitle').textContent = title;
  $('modalText').textContent = text;
  const box = $('modalActions'); box.innerHTML = '';
  actions.forEach(a=>{
    const b = document.createElement('button');
    b.type='button'; b.className='choice';
    b.innerHTML = '<b>'+a.label+'</b><span>'+(a.desc||'')+'</span>';
    b.addEventListener('click', ()=>{
      $('eventModal').classList.remove('open');
      add(a.eff); if(a.note) say(a.note); paintSide(); a.go && a.go();
    });
    box.appendChild(b);
  });
  $('eventModal').classList.add('open');
}

/* ---------- 战斗（独立页：我方/敌方立绘 + 中间骰子区） ---------- */
let pending = null;
function fight(o){
  show('battle');
  $('plSprite').innerHTML = '<img src="'+IMG.lead+'" alt="我方立绘">';
  $('battleText').textContent = o.text;
  if(o.rail !== undefined) paintRail(o.rail);
  else if(F.stage) paintRail(F.stage);
  else hideRail();

  const pv = o.value, extra = o.extra || 0;
  const pd = CFG.dice(pv) + extra, ed = o.enemy;
  const playerLabel = o.playerLabel || ('德廉美 · ' + (o.statLabel||''));
  const enemyLabel = o.enemyLabel || '敌军';
  pending = { pd, ed, o };

  $('pDice').innerHTML = '<span class="lbl">这里放骰子+点数</span>';
  $('eDice').innerHTML = '<span class="lbl">这里放骰子+点数</span>';
  $('pCount').innerHTML = '<small>'+playerLabel+'</small>我方骰子数 '+pd+' 枚';
  $('eCount').innerHTML = '<small>'+enemyLabel+'</small>敌方骰子数 '+ed+' 枚';
  $('battleResult').textContent = '';

  const box = $('battleActions'); box.innerHTML = '';
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'chip-btn';
  btn.textContent = '同时掷骰';
  btn.addEventListener('click', roll);
  box.appendChild(btn);
  paintSide();
}
function roll(){
  const { pd, ed, o } = pending;
  const pr = Array.from({length:pd}, ()=>1+Math.floor(Math.random()*6));
  const er = Array.from({length:ed}, ()=>1+Math.floor(Math.random()*6));
  const ps = pr.reduce((a,b)=>a+b,0), es = er.reduce((a,b)=>a+b,0);
  $('pDice').innerHTML = pr.map(x=>'<span class="die">'+x+'</span>').join('')+'<span class="dice-sum">= '+ps+'</span>';
  $('eDice').innerHTML = er.map(x=>'<span class="die">'+x+'</span>').join('')+'<span class="dice-sum">= '+es+'</span>';
  let r = ps > es ? '胜' : ps < es ? '败' : '平';
  let resText = (r==='平' ? '平局' : r+'利') + ' · ' + ps + ' : ' + es;
  if(!o.allowDraw && r === '平') r = '败';

  const branch = r==='胜' ? o.win : r==='败' ? o.lose : o.draw;
  if(!branch){
    $('battleResult').textContent = resText;
    o.done && o.done(r); return;
  }
  add(branch.eff);
  if(branch.note) say(branch.note);
  $('battleResult').textContent = resText + (branch.note ? '　——　' + branch.note : '');

  const box = $('battleActions'); box.innerHTML = '';
  const back = document.createElement('button');
  back.type = 'button'; back.className = 'chip-btn';
  back.textContent = branch.btn || '继续';
  back.addEventListener('click', ()=> branch.go ? branch.go(r) : (o.done && o.done(r)));
  box.appendChild(back);
  paintSide();
}

/* ---------- 章节页（黑底 Chapter N / 章节名 / 外语章节名） ---------- */
let chTimer = null;
function chapter(n, name, foreign, next){
  show('chapter');
  $('chNum').textContent = n;
  $('chName').textContent = name;
  $('chForeign').textContent = foreign;
  $('chapter').onclick = ()=>{
    if(chTimer === null) return;
    clearTimeout(chTimer); chTimer = null; next();
  };
  chTimer = setTimeout(()=>{ chTimer = null; next(); }, 2400);

    draw:{ btn:'战后复盘',

        '主帅带领厨师们与香肠人在外围草地正面碰上了，厨师们挥舞着火炉、烤炉、平底锅、火钳、烤盘、锅铲，但香肠人数量实在是太多了，甚至可以七八个人围着一个厨师。双方打了很久，精疲力竭，一直到天都亮了，只好各自回退。\n\n你与众人一起复盘了本次战斗。',

  });

       p:'许是日里喝了太多酒，你完全沉入了酣美的睡眠，再次醒来已是十日之后。\n\n菲利普说那天早上他来找你，但是你怎么也晃不醒。他很担心，于是留下来陪护，没有去葡萄园。\n\n德廉美的日子在你醒来后照常运转，什么都没有发生，也好像什么也不会发生。\n\n是这样吗？\n\n……\n\n……\n\n别管了，先喝酒吧。\n\n—— THE END ——' },
  2: { t:'酒与血的祭奠', s:'',
       p:'酒液一旦倾洒在地上，便无人能将其收回。血也一样。\n\n你们耗尽了几乎所有力量走到了终局，但还是差了一步。\n\n你自己、你的战友、你的同伴、你继承自先祖的荣光、你的理想之邦……都如同倾倒的酒液，永远地没入了尘土。\n\n—— THE END ——' },
  3: { t:'无尽的祷告', s:'',
       p:'此前的战斗已经消耗了你过多的体力与精神。这个阿尔蒙召唤出来的「虔信的巨人」太过强大，而且随着修士们机械的祷告声在空荡荡的圣弗洛朗院内的回响，似乎在无穷无尽地膨胀。你与你的同伴们几乎被那股庞大的力量压制在地，无法动弹。\n\n你对于那场决战最后的记忆，是晕过去之前，看到阿尔蒙面对巨人的虚影，做了一场极为细致认真的祷告……\n\n钟声重新在卢瓦尔河谷的两岸回响。德廉美被并入了圣弗洛朗，而那座葡萄园也被拆除，改种了小麦，继承了西园的管理方式，如果有修士触犯会规，就被罚入河边的磨坊进行体力劳动。\n\n菲利普因为谋害前任教皇被当众绞死。\n\n莉娜和玛格丽特被送到圣弗洛朗名下的女修院重新受洗和修行，此后再没有听说过她们。\n\n托马斯在那场决战中受了重伤，没多久便不治而亡。\n\n阿尔蒙为你举办了一场受洗仪式，冗长的祝祷文字从你身上流过，他宣布现在你从前属于异教的邪恶灵魂已经被涤净，而纯洁、节制与谦卑会在你身上重新扎根。阿尔蒙以主教的职位参与了教皇的选举，而这场声势浩大的「德廉美巨人」受洗仪式，似乎为他挣得了不少的支持，成为了他登上圣座的重要一步。信徒们都在议论，新任的教皇阿尔蒙大人准备在教廷内举行一次神圣审判，而此次的对象，不是别人，正是教廷内部所有的神职人员……但后续如何，已经不再是你所知道的事情了。\n\n—— THE END ——' },
  4: { t:'责任之始', s:'',
       p:'你成为了德廉美真正意义上的领导者。\n\n德廉美欢迎所有高尚、真诚与纯洁之人，不欢迎一切假善、诡计多端与贪得无厌之人，这是自约翰修士从你的先祖手中得到这片土地、建立起这座名为「德廉美」的修道院起，就铭刻在大门的题词上的，虽不如那几座镌刻着「随心所欲，各行其是」的石碑那样显眼，但那依然是每个德廉美人身上隐形的标尺。\n\n想想一路走来你遇到的一切，想想玛格丽特，想想皮埃尔，想想艾格尼丝，想想阿尔蒙，想想圣弗洛朗的修士……你好像对这句话有了与之前不一样的理解。\n\n故事已经行至终章，但新的可能已经随着那枚徽章落入你的手中。\n\n—— THE END ——' }
};
function ending(n){
  const e = ENDINGS[n];
  const body = e.p;
  show('ending');
  $('endingTitle').textContent = 'End ' + e.t;
  $('endingText').textContent = (e.s ? '（' + e.s + '）\n\n' : '') + body;
  $('endingStats').innerHTML = chipsHTML();
}

/* ==========================================================================
   启动
   ========================================================================== */
function startGame(){ reset(); chapter('Prologue','德廉美','Thélème', ()=>pro(0)); }
function exitGame(){
  document.querySelector('.title-inner h1').textContent = '下次再见';
  document.querySelector('.title-menu').innerHTML = '<button type="button" class="title-button" id="returnBtn">返回标题</button>';
  $('returnBtn').addEventListener('click', ()=>location.reload());
}
/* ---------- 暂停 ---------- */
function openPause(){
  $('pzParty').innerHTML = partyHTML();
  $('pzFavor').innerHTML = favorHTML();
  $('pzLog').innerHTML = logHTML(40);
  $('pauseModal').classList.add('open');
}
$('pauseBtn').addEventListener('click', openPause);
$('pauseBtn2').addEventListener('click', openPause);
$('dlgBox').addEventListener('click', dlgNext);
$('pzResume').addEventListener('click', ()=>$('pauseModal').classList.remove('open'));
$('pzRestart').addEventListener('click', ()=>location.reload());
$('pzExit').addEventListener('click', ()=>{ $('pauseModal').classList.remove('open'); show('intro'); });
$('endGo').addEventListener('click', ()=>show('intro'));
$('startBtn').addEventListener('click', startGame);
$('exitBtn').addEventListener('click', exitGame);
document.addEventListener('keydown', e=>{
  if(e.key === 'Enter' && $('intro').classList.contains('active')) startGame();
  if((e.key === ' ' || e.key === 'Enter') && $('scene').classList.contains('active') && !$('dlgBox').hidden){
    e.preventDefault(); dlgNext(); return;
  }
  if(e.key === 'Escape' && !$('intro').classList.contains('active') && !$('ending').classList.contains('active')){
    const pz = $('pauseModal');
    if(pz.classList.contains('open')) pz.classList.remove('open');
    else if($('scene').classList.contains('active') || $('battle').classList.contains('active')) openPause();
  }
});
document.querySelector('#scene .stage').style.backgroundImage = 'url(' + IMG.scene + ')';
document.querySelector('#battle .stage').style.backgroundImage = 'url(' + IMG.battle + ')';
reset();
</script>
</body>
</html>
